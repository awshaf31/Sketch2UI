name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    name: Typecheck, Test, Build, E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run TypeScript tests
        run: npm run test

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CV worker dependencies
        working-directory: cv-service
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Run Python tests
        run: npm run test:py

      - name: Production build
        run: npm run build

      - name: Install Playwright OS dependencies
        run: npx playwright install-deps
        # No browser download here: playwright.config.ts pins its one project to
        # `channel: "chrome"` (system-installed Google Chrome), which ubuntu-latest
        # ships pre-installed. This only installs the shared libraries headless
        # Chrome needs to run — no Playwright-managed browser binary is used.

      - name: Playwright E2E
        run: npm run test:e2e
        # playwright.config.ts's webServer array starts the mock CV worker, the real
        # API, and the real web app itself (all via npx tsx/vite from source) against
        # throwaway temp-dir storage. PERSISTENCE_DRIVER/DATABASE_URL are never set
        # in this job, so — like the Vitest step above — this never touches Postgres
        # or any development credentials.

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
