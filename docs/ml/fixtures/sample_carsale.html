<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sample_carsale</title>
  <style>
:root {
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.5rem;
  --space-6: 2rem;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: system-ui, sans-serif;
  color: #1f2937;
  background: #ffffff;
  line-height: 1.5;
}

img {
  max-width: 100%;
  display: block;
}

.ui-section {
  padding: var(--space-6) 6vw;
}

.ui-image {
  width: 100%; border-radius: 8px;
}

.ui-text {
  margin: 0 0 var(--space-3) 0; color: #4b5563;
}

.ui-heading {
  margin: 0 0 var(--space-3) 0;
}

.ui-button {
  border: 0; padding: 0.75rem 1rem; border-radius: 8px; cursor: pointer; background: #1f2937; color: #fff; font: inherit;
}

body {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

#section-2 {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

#image-group-21 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 24px;
}

#section-5 {
  display: flex;
  align-items: center;
  gap: 24px;
}

#section-16 {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

#text-group-22 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 24px;
}

@media (max-width: 768px) {
  #image-group-21 {
    grid-template-columns: 1fr;
  }

  #section-5 {
    flex-wrap: wrap;
  }

  #text-group-22 {
    grid-template-columns: 1fr;
  }
}

</style>
</head>
<body>
  <section id="section-1" class="ui-section">
    <section id="section-12" class="ui-section">
      <img id="image-10" class="ui-image" src="./assets/image-10.png" alt="Image placeholder" />
    </section>
  </section>

  <section id="section-2" class="ui-section">
    <div id="image-group-21" class="ui-group">
      <img id="image-9" class="ui-image" src="./assets/image-9.png" alt="Image placeholder" />
      <img id="image-3" class="ui-image" src="./assets/image-3.png" alt="Image placeholder" />
      <img id="image-6" class="ui-image" src="./assets/image-6.png" alt="Image placeholder" />
    </div>
    <p id="text-18" class="ui-text">
      Your generated description goes here.
    </p>
    <h2 id="heading-13" class="ui-heading">
      Heading
    </h2>
    <h2 id="heading-14" class="ui-heading">
      Heading
    </h2>
    <p id="text-20" class="ui-text">
      Your generated description goes here.
    </p>
  </section>

  <section id="section-5" class="ui-section">
    <p id="text-15" class="ui-text">
      Your generated description goes here.
    </p>
    <section id="section-16" class="ui-section">
      <p id="text-19" class="ui-text">
        Your generated description goes here.
      </p>
      <div id="text-group-22" class="ui-group">
        <p id="text-4" class="ui-text">
          Your generated description goes here.
        </p>
        <p id="text-11" class="ui-text">
          Your generated description goes here.
        </p>
      </div>
    </section>
  </section>

  <h2 id="heading-8" class="ui-heading">
    Heading
  </h2>

  <section id="section-7" class="ui-section">
    <button id="button-17" class="ui-button">
      Button
    </button>
  </section>
</body>
</html>
