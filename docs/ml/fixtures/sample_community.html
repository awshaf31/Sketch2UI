<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sample_community</title>
  <style>
:root {
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.5rem;
  --space-6: 2rem;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: system-ui, sans-serif;
  color: #1f2937;
  background: #ffffff;
  line-height: 1.5;
}

img {
  max-width: 100%;
  display: block;
}

.ui-section {
  padding: var(--space-6) 6vw;
}

.ui-image {
  width: 100%; border-radius: 8px;
}

.ui-heading {
  margin: 0 0 var(--space-3) 0;
}

.ui-text {
  margin: 0 0 var(--space-3) 0; color: #4b5563;
}

body {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

#section-6 {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

#image-group-24 {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 24px;
}

#section-7 {
  display: flex;
  align-items: center;
  gap: 24px;
}

#section-1 {
  display: flex;
  align-items: center;
  gap: 24px;
}

#section-10 {
  display: flex;
  align-items: center;
  gap: 24px;
}

#section-9 {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

@media (max-width: 768px) {
  #image-group-24 {
    grid-template-columns: 1fr;
  }

  #section-7 {
    flex-wrap: wrap;
  }

  #section-1 {
    flex-wrap: wrap;
  }

  #section-10 {
    flex-wrap: wrap;
  }
}

</style>
</head>
<body>
  <section id="section-6" class="ui-section">
    <img id="image-12" class="ui-image" src="./assets/image-12.png" alt="Image placeholder" />
    <h2 id="heading-22" class="ui-heading">
      Heading
    </h2>
    <div id="image-group-24" class="ui-group">
      <img id="image-2" class="ui-image" src="./assets/image-2.png" alt="Image placeholder" />
      <img id="image-5" class="ui-image" src="./assets/image-5.png" alt="Image placeholder" />
      <img id="image-3" class="ui-image" src="./assets/image-3.png" alt="Image placeholder" />
      <img id="image-4" class="ui-image" src="./assets/image-4.png" alt="Image placeholder" />
    </div>
  </section>

  <section id="section-7" class="ui-section">
    <img id="image-16" class="ui-image" src="./assets/image-16.png" alt="Image placeholder" />
    <img id="image-14" class="ui-image" src="./assets/image-14.png" alt="Image placeholder" />
    <img id="image-15" class="ui-image" src="./assets/image-15.png" alt="Image placeholder" />
  </section>

  <section id="section-1" class="ui-section">
    <img id="image-19" class="ui-image" src="./assets/image-19.png" alt="Image placeholder" />
    <img id="image-21" class="ui-image" src="./assets/image-21.png" alt="Image placeholder" />
    <img id="image-20" class="ui-image" src="./assets/image-20.png" alt="Image placeholder" />
    <img id="image-18" class="ui-image" src="./assets/image-18.png" alt="Image placeholder" />
  </section>

  <section id="section-10" class="ui-section">
    <img id="image-11" class="ui-image" src="./assets/image-11.png" alt="Image placeholder" />
    <img id="image-13" class="ui-image" src="./assets/image-13.png" alt="Image placeholder" />
    <img id="image-8" class="ui-image" src="./assets/image-8.png" alt="Image placeholder" />
  </section>

  <section id="section-9" class="ui-section">
    <h2 id="heading-23" class="ui-heading">
      Heading
    </h2>
    <p id="text-17" class="ui-text">
      Your generated description goes here.
    </p>
  </section>
</body>
</html>
